name: Publish Docker image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing VERSION-compatible release tag to publish'
        required: true
        type: string
      commit:
        description: 'Full commit SHA already reachable from the default branch'
        required: true
        type: string

concurrency:
  group: docker-publish-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/new-api-ultra

jobs:
  publish:
    name: Build and publish multi-architecture image
    if: ${{ github.event_name == 'push' || github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    # The CI gate may wait up to 30 minutes for the main-branch checks before
    # the multi-architecture QEMU build starts. Leave enough headroom for both.
    timeout-minutes: 90
    permissions:
      contents: read
      checks: read
      actions: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve and validate image tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_REF_NAME: ${{ github.ref_name }}
          REF_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          COMMIT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          tag="$REF_NAME"
          commit="$(printf '%s' "$COMMIT_SHA" | tr '[:upper:]' '[:lower:]')"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$TRIGGER_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Manual publication must be dispatched from the default branch '$DEFAULT_BRANCH'"
            exit 1
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not a supported vX.Y.Z release tag"
            exit 1
          fi
          if [[ ! "$commit" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Commit '$commit' is not a full 40-character SHA"
            exit 1
          fi
          if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
            echo "::error::The selected commit '$commit' is not present in the checkout"
            exit 1
          fi
          git checkout --detach "$commit"
          committed_version="$(tr -d '\r\n' < VERSION)"
          if [[ "$tag" != "$committed_version" ]]; then
            echo "::error::Tag '$tag' must exactly match the committed VERSION '$committed_version'; update VERSION in a source commit before tagging."
            exit 1
          fi
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$commit" "origin/$DEFAULT_BRANCH"; then
            echo "::error::The selected commit is not reachable from origin/$DEFAULT_BRANCH"
            exit 1
          fi
          tag_commit="$(git ls-remote origin "refs/tags/$tag^{}" 2>/dev/null | awk 'NR == 1 { print $1 }' || true)"
          if [[ -z "$tag_commit" ]]; then
            tag_commit="$(git ls-remote --refs origin "refs/tags/$tag" 2>/dev/null | awk 'NR == 1 { print $1 }' || true)"
          fi
          if [[ -z "$tag_commit" ]]; then
            echo "::error::Tag '$tag' does not exist on origin"
            exit 1
          fi
          if [[ "$tag_commit" != "$commit" ]]; then
            echo "::error::Tag '$tag' points to '$tag_commit', not the selected commit '$commit'"
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" && "$commit" != "$GITHUB_SHA" ]]; then
            echo "::error::The tag event SHA and selected commit differ"
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'short_commit=%s\n' "${commit:0:7}" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag from $commit"

      - name: Require immutable v* tag ruleset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The REST ruleset endpoint intentionally redacts bypass_actors and
          # current_user_can_bypass for a read-only Actions token. Query the
          # same policy through GraphQL, whose connection exposes the actor
          # count without leaking actor identities. Fail closed on any API or
          # schema error rather than treating an unavailable count as zero.
          query='query($owner: String!, $name: String!) {
            repository(owner: $owner, name: $name) {
              rulesets(first: 100, includeParents: false) {
                nodes {
                  databaseId
                  target
                  enforcement
                  conditions { refName { include exclude } }
                  bypassActors(first: 100) { totalCount }
                  rules(first: 100) { nodes { type } }
                }
              }
            }
          }'
          owner="${REPOSITORY%%/*}"
          name="${REPOSITORY#*/}"
          payload="$(jq -cn --arg query "$query" --arg owner "$owner" --arg name "$name" \
            '{query:$query,variables:{owner:$owner,name:$name}}')"
          response="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 2 \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_URL/graphql" \
            --data "$payload")"
          if jq -e '(.errors // []) | length > 0' <<<"$response" >/dev/null; then
            echo '::error::GitHub GraphQL ruleset query failed; release policy could not be verified.'
            jq -r '.errors[]?.message' <<<"$response" >&2
            exit 1
          fi
          protected="$(jq -r '[.data.repository.rulesets.nodes[]
            | select(.target == "TAG" and .enforcement == "ACTIVE")
            | select((.bypassActors.totalCount // -1) == 0)
            | select(((.conditions.refName.include // []) | index("refs/tags/v*")) != null)
            | select(((.conditions.refName.exclude // []) | length) == 0)
            | select((((.rules.nodes // []) | map(.type)) | index("DELETION")) != null)
            | select((((.rules.nodes // []) | map(.type)) | index("NON_FAST_FORWARD")) != null)
          ] | length' <<<"$response")"
          if [[ "$protected" != 1 ]]; then
            echo '::error::An active repository tag ruleset for refs/tags/v* with deletion and non-fast-forward protection is required before publishing GHCR images.'
            exit 1
          fi
          echo 'Release tag ruleset verified through the GitHub GraphQL API.'

      - name: Require go-epay redistribution authorization
        env:
          ALLOW_GO_EPAY_REDISTRIBUTION: ${{ vars.ALLOW_GO_EPAY_REDISTRIBUTION }}
        run: |
          set -euo pipefail
          if [[ "$ALLOW_GO_EPAY_REDISTRIBUTION" != "true" ]]; then
            echo "::error::GHCR publication is disabled until the repository variable ALLOW_GO_EPAY_REDISTRIBUTION=true is set after written confirmation from the go-epay rights holder."
            exit 1
          fi

      - name: Require successful CI for tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ steps.version.outputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # A tag can be created while the main-branch CI run is still queued.
          # Resolve the exact push/main run of this repository's ci.yml first;
          # unrelated pull-request checks or another workflow must not satisfy
          # the release gate for the same commit.
          for attempt in $(seq 1 60); do
            runs="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 2 \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API_URL/repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$COMMIT_SHA&event=push&branch=$DEFAULT_BRANCH&per_page=100")"
            run_meta="$(printf '%s' "$runs" | jq -r --arg sha "$COMMIT_SHA" --arg branch "$DEFAULT_BRANCH" '
              [.workflow_runs[]
                | select(.head_sha == $sha
                      and .event == "push"
                      and .head_branch == $branch
                      and .path == ".github/workflows/ci.yml")]
              | sort_by([.run_number, .run_attempt, .created_at])
              | if length == 0 then empty else last | [.id, .status, (.conclusion // "")] | @tsv end')"
            if [[ -z "$run_meta" ]]; then
              echo "Waiting for the exact push/main CI run (attempt $attempt/60)"
              sleep 30
              continue
            fi
            read -r run_id run_status run_conclusion <<< "$run_meta"
            if [[ "$run_status" == "completed" && "$run_conclusion" != "success" ]]; then
              echo "::error::The exact push/main CI workflow run $run_id concluded $run_conclusion for $COMMIT_SHA"
              exit 1
            fi
            jobs="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 2 \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API_URL/repos/$REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"
            summary="$(printf '%s' "$jobs" | jq -r '
              [.jobs[]
                | select(.name == "Backend vet, build, and test"
                      or .name == "Frontend typecheck, build, and test"
                      or .name == "Docker build smoke test")]
              | sort_by(.name, .started_at)
              | group_by(.name)
              | map(last)
              | {total: length,
                 pending: (map(select(.status != "completed")) | length),
                 failed: (map(select(.status == "completed" and .conclusion != "success")) | length)}
              | [.total, .pending, .failed] | @tsv')"
            read -r total pending failed <<< "$summary"
            if (( failed > 0 )); then
              echo "::error::At least one required CI job failed in workflow run $run_id for $COMMIT_SHA"
              exit 1
            fi
            if [[ "$run_status" == "completed" && "$run_conclusion" == "success" && "$total" == 3 && "$pending" == 0 ]]; then
              echo "Required push/main CI jobs passed in workflow run $run_id for $COMMIT_SHA"
              exit 0
            fi
            echo "Waiting for required push/main CI jobs (attempt $attempt/60): run=$run_id status=$run_status total=$total pending=$pending"
            sleep 30
          done
          echo "::error::Required push/main CI workflow did not complete successfully for $COMMIT_SHA"
          exit 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # The manual retry workflow checks out the selected release commit
          # after the workflow itself starts on main. Read Git metadata from
          # that detached checkout so OCI annotations cannot point at the
          # dispatcher workflow commit instead of the image source.
          context: git
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=sha-${{ steps.version.outputs.short_commit }}
          labels: |
            org.opencontainers.image.revision=${{ steps.version.outputs.commit }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
          # metadata-action adds the manifest/index level prefix; keep the
          # custom input as a plain OCI key so both levels receive the same
          # selected source commit.
          annotations: |
            org.opencontainers.image.revision=${{ steps.version.outputs.commit }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Verify generated OCI annotations
        env:
          EXPECTED_REVISION: ${{ steps.version.outputs.commit }}
          METADATA_ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          set -euo pipefail
          expected="org.opencontainers.image.revision=${EXPECTED_REVISION}"
          for level in index manifest; do
            if ! grep -Fxq "${level}:${expected}" <<<"${METADATA_ANNOTATIONS}"; then
              echo "::error::metadata-action did not generate ${level}:${expected}"
              printf '%s\n' "${METADATA_ANNOTATIONS}"
              exit 1
            fi
          done

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Publish summary
        run: |
          {
            echo '### Published image'
            echo '```'
            echo "${IMAGE_NAME}:${{ steps.version.outputs.tag }}"
            echo "source: ${{ steps.version.outputs.commit }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"